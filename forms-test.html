<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>233 SQN | Netlify Forms Test</title><style>body{font:16px system-ui,sans-serif;background:#edf3f8;color:#172d43;margin:0;padding:24px}main{max-width:620px;margin:auto;background:white;padding:28px;border-radius:14px}h1{margin-top:0}label{display:block;margin:14px 0 6px;font-weight:600}input,select,button{font:inherit;padding:12px;width:100%;box-sizing:border-box;border-radius:7px;border:1px solid #aabac9}button{background:#17639a;color:white;border:0;font-weight:bold;margin-top:20px;cursor:pointer}button:disabled{opacity:.6}.notice{background:#fff7e9;padding:12px;border-left:4px solid #bd7916}#result{margin-top:15px;white-space:pre-wrap}</style></head><body><main><h1>Netlify Forms test</h1><p class="notice">For authorised testing only. This page submits <strong>fictional information</strong> to the 233 SQN absence form and triggers the configured notification. Do not enter real cadet details.</p><form id="testForm" name="233-sqn-absence" method="POST" action="/"><input type="hidden" name="form-name" value="233-sqn-absence"><input type="hidden" name="bot-field" value=""><label for="scenario">Fictional test scenario</label><select id="scenario"><option value="scheduled">CDT Alex Example — scheduled leave</option><option value="sick">LCDT Taylor Example — sick leave</option></select><button id="send" type="submit">Send fictional test submission</button></form><p id="result" role="status" aria-live="polite"></p><p><a href="/">Return to absence form</a></p></main><script>
const scenarios={scheduled:{rank:"CDT",cadetName:"Alex Example",flight:"1 Flight",startDate:"2026-11-18",endDate:"",reason:"Scheduled leave",comments:"TEST ONLY — fictional data. Please disregard.",submitter:"Cadet"},sick:{rank:"LCDT",cadetName:"Taylor Example",flight:"2 Flight",startDate:"2026-11-18",endDate:"",reason:"Sick leave",comments:"TEST ONLY — fictional data. Please disregard.",submitter:"Parent / guardian"}};
document.getElementById("testForm").addEventListener("submit",async e=>{e.preventDefault();const button=document.getElementById("send"),status=document.getElementById("result");button.disabled=true;status.textContent="Submitting fictional test…";const params=new URLSearchParams({"form-name":"233-sqn-absence",...scenarios[document.getElementById("scenario").value]});try{const res=await fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:params.toString()});if(!res.ok)throw new Error("HTTP "+res.status);status.textContent="Test submitted. Check Netlify Forms for a new entry and your AAFC inbox for the notification. Email delivery is not yet confirmed.";}catch(err){status.textContent="Submission failed: "+err.message;}finally{button.disabled=false;}});
</script></body></html>
