<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>233 Squadron | Dashboard Demo</title><link rel="stylesheet" href="../style.css"></head><body><header><small>Australian Air Force Cadets · Demonstration</small><h1>233 Squadron</h1><p>Staff Dashboard Demo</p></header><main class="wide"><div class="card"><div class="notice">PUBLIC FICTIONAL DEMO. No login. Anyone can change demo statuses. Never enter real personnel or attendance data.</div><div class="toolbar"><button id="export">Export demo CSV</button><a href="../">Cadet sign-in demo</a></div><div class="filters"><div><label for="date">Parade date</label><input type="date" id="date"></div><div><label for="flight">Section</label><select id="flight"><option value="">All sections</option><option>Senior Cadets</option><option>1 Flight</option><option>2 Flight</option><option>3 Flight</option></select></div></div><div id="stats" class="stats"></div><h2>Live demonstration roll</h2><div class="tablewrap"><table><thead><tr><th>Rank</th><th>Name</th><th>Section</th><th>Attendance</th></tr></thead><tbody id="rows"></tbody></table></div><p id="feedback" role="status"></p></div></main><footer>Fictional data only</footer><script src="../config.js"></script><script type="module">import {ready,demoRoster,statuses,today,watch,update} from "../firebase-demo.js";const dateEl=document.getElementById("date"),flightEl=document.getElementById("flight"),feedback=document.getElementById("feedback");dateEl.value=today();let entries=[],shown=[],unsubscribe=()=>{};function render(){shown=demoRoster.filter(p=>!flightEl.value||p.flight===flightEl.value).map(p=>({...p,...(entries.find(e=>e.id===p.id)||{}),id:p.id}));const stats=document.getElementById("stats");stats.replaceChildren();for(const status of statuses){const d=document.createElement("div");d.className="stat";const strong=document.createElement("strong");strong.textContent=shown.filter(r=>(r.status||"Unmarked")===status).length;const label=document.createElement("span");label.textContent=status;d.append(strong,label);stats.appendChild(d)}const body=document.getElementById("rows");body.replaceChildren();for(const r of shown){const tr=document.createElement("tr");for(const value of [r.rank,r.name,r.flight]){const td=document.createElement("td");td.textContent=value;tr.appendChild(td)}const td=document.createElement("td"),sel=document.createElement("select");sel.setAttribute("aria-label","Attendance status for "+r.name);for(const status of statuses){const option=document.createElement("option");option.value=status;option.textContent=status;sel.appendChild(option)}sel.value=r.status||"Unmarked";sel.disabled=!ready;sel.onchange=async()=>{sel.disabled=true;try{await update(dateEl.value,r.id,sel.value)}catch(err){feedback.textContent="Could not save: "+err.message;sel.value=r.status||"Unmarked"}finally{sel.disabled=!ready}};td.appendChild(sel);tr.appendChild(td);body.appendChild(tr)}}function subscribe(){unsubscribe();entries=[];render();if(!ready){feedback.textContent="Firebase Web API Key is not configured yet.";return}unsubscribe=watch(dateEl.value,rows=>{entries=rows;feedback.textContent="Live Firebase demo connected.";render()},err=>{feedback.textContent="Firebase access unavailable: "+err.message})}dateEl.onchange=subscribe;flightEl.onchange=render;document.getElementById("export").onclick=()=>{const keys=["rank","name","flight","status"];const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';const csv=[keys.join(","),...shown.map(r=>keys.map(k=>q(k==="status"?(r.status||"Unmarked"):r[k])).join(","))].join("\r\n");const url=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download="233-sqn-fictional-demo-"+dateEl.value+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};subscribe();</script></body></html>
