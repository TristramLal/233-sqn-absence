<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>233 Squadron | Cadet Sign-In</title><link rel="stylesheet" href="./style.css"></head><body><header><small>Australian Air Force Cadets · 2 Wing</small><h1>233 Squadron</h1><p>Wednesday Parade · Cadet Sign-In</p></header><main><div class="card"><h2>Sign in for parade</h2><p class="muted">Complete this form when you arrive at Squadron. Staff will verify the roll.</p><form id="signIn"><label for="rank">Cadet rank</label><select id="rank" required><option value="">Select rank</option><option>CDT</option><option>LCDT</option><option>CCPL</option><option>CSGT</option><option>CFSGT</option><option>CWOFF</option><option>CUO</option></select><label for="cadetName">Full name</label><input id="cadetName" maxlength="100" autocomplete="name" required><label for="flight">Flight</label><select id="flight" required><option value="">Select flight</option><option>1 Flight</option><option>2 Flight</option><option>3 Flight</option></select><button id="submit" class="primary" type="submit" disabled>Sign-in unavailable until setup is complete</button></form><p id="feedback" class="hidden" role="status"></p></div></main><footer>233 Squadron AAFC · Staff verify attendance separately</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./config.js"></script><script>const cfg=window.ROLL_CONFIG||{};const configured=Boolean(cfg.url&&cfg.anonKey);const client=configured?window.supabase.createClient(cfg.url,cfg.anonKey):null;const dateBrisbane=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Australia/Brisbane',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());function message(id,text,error=false){const el=document.getElementById(id);el.textContent=text;el.className='message'+(error?' error':'')};const btn=document.getElementById('submit');if(configured){btn.disabled=false;btn.textContent='Sign in'}else{message('feedback','The central attendance system has not been configured yet.',true)}document.getElementById('signIn').addEventListener('submit',async e=>{e.preventDefault();if(!client)return;btn.disabled=true;btn.textContent='Submitting…';const name=document.getElementById('cadetName').value.trim().replace(/\s+/g,' ');if(name.length<3){message('feedback','Enter your full name.',true);btn.disabled=false;btn.textContent='Sign in';return}const {error}=await client.from('attendance').insert({rank:document.getElementById('rank').value,cadet_name:name,flight:document.getElementById('flight').value,parade_date:dateBrisbane(),status:'Present',source:'cadet'});if(error){message('feedback','Sign-in was not recorded. Please see a staff member.',true);btn.disabled=false;btn.textContent='Try again'}else{document.getElementById('signIn').reset();document.getElementById('signIn').classList.add('hidden');message('feedback','Sign-in received. Please report to your flight.')}});</script></body></html>
