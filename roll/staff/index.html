<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>233 Squadron | Staff Roll</title><link rel="stylesheet" href="../style.css"></head><body><header><small>Australian Air Force Cadets · 2 Wing</small><h1>233 Squadron</h1><p>Staff Attendance Dashboard</p></header><main><div class="card"><div id="setup" class="message hidden">Central database setup is required before staff sign-in is available.</div><section id="login"><h2>Staff sign-in</h2><form id="loginForm"><label for="email">Approved staff email</label><input id="email" type="email" required autocomplete="username"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><button class="primary" type="submit">Sign in</button></form></section><section id="dashboard" class="hidden"><div class="toolbar"><button id="logout">Sign out</button><button id="refresh">Refresh roll</button><button id="export">Export CSV</button></div><label for="date">Parade date</label><input type="date" id="date"><div id="stats" class="stats"></div><h2>Attendance records</h2><div style="overflow-x:auto"><table><thead><tr><th>Rank</th><th>Name</th><th>Flight</th><th>Status</th><th>Source</th><th>Recorded</th></tr></thead><tbody id="rows"></tbody></table></div><h2>Record absent cadet</h2><form id="absence"><label for="rank">Rank</label><select id="rank" required><option value="">Select rank</option><option>CDT</option><option>LCDT</option><option>CCPL</option><option>CSGT</option><option>CFSGT</option><option>CWOFF</option><option>CUO</option></select><label for="cadetName">Full name</label><input id="cadetName" required maxlength="100"><label for="flight">Flight</label><select id="flight" required><option value="">Select flight</option><option>1 Flight</option><option>2 Flight</option><option>3 Flight</option></select><label for="status">Status</label><select id="status"><option value="Away - no leave request">Away — no leave request</option><option value="Away - leave request received">Away — leave request received</option><option value="Late">Late arrival</option></select><button class="primary" type="submit">Record attendance status</button></form></section><p id="feedback" role="status"></p></div></main><footer>Staff access only · 233 Squadron</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="../config.js"></script><script>const cfg=window.ROLL_CONFIG||{};const configured=Boolean(cfg.url&&cfg.anonKey);const client=configured?window.supabase.createClient(cfg.url,cfg.anonKey):null;const dateBrisbane=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Australia/Brisbane',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());function message(id,text,error=false){const el=document.getElementById(id);el.textContent=text;el.className='message'+(error?' error':'')};const login=document.getElementById('login'),dash=document.getElementById('dashboard'),date=document.getElementById('date');date.value=dateBrisbane();let records=[];async function auth(){if(!client){document.getElementById('setup').classList.remove('hidden');return}const {data}=await client.auth.getUser();const user=data?.user;if(!user){login.classList.remove('hidden');dash.classList.add('hidden');return}const {data:staff,error}=await client.from('staff_users').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!staff){await client.auth.signOut();message('feedback','This account is not authorised for staff access.',true);return}login.classList.add('hidden');dash.classList.remove('hidden');await load()}async function load(){const {data,error}=await client.from('attendance').select('rank,cadet_name,flight,status,source,parade_date,created_at').eq('parade_date',date.value).order('created_at',{ascending:true});if(error){message('feedback','Unable to load roll.',true);return}records=data||[];const stats=document.getElementById('stats');stats.replaceChildren();[['Present','Present'],['Late','Late'],['Away - no leave request','Away — no leave'],['Away - leave request received','Away — leave received']].forEach(([value,label])=>{const d=document.createElement('div');d.className='stat';const n=document.createElement('strong');n.textContent=records.filter(x=>x.status===value).length;const s=document.createElement('span');s.textContent=label;d.append(n,s);stats.appendChild(d)});const rows=document.getElementById('rows');rows.replaceChildren();records.forEach(x=>{const tr=document.createElement('tr');[x.rank,x.cadet_name,x.flight,x.status,x.source,new Date(x.created_at).toLocaleString('en-AU',{timeZone:'Australia/Brisbane'})].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});rows.appendChild(tr)});message('feedback',records.length+' entries loaded for '+date.value)}document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const {error}=await client.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error)message('feedback','Sign-in failed. Check your details.',true);else await auth()});document.getElementById('logout').onclick=async()=>{await client.auth.signOut();login.classList.remove('hidden');dash.classList.add('hidden')};document.getElementById('refresh').onclick=load;date.onchange=load;document.getElementById('absence').addEventListener('submit',async e=>{e.preventDefault();const {error}=await client.from('attendance').insert({rank:document.getElementById('rank').value,cadet_name:document.getElementById('cadetName').value.trim(),flight:document.getElementById('flight').value,status:document.getElementById('status').value,parade_date:date.value,source:'staff'});if(error)message('feedback','Unable to save staff entry.',true);else{document.getElementById('absence').reset();await load()}});document.getElementById('export').onclick=()=>{if(!records.length){message('feedback','No records to export.',true);return}const keys=['rank','cadet_name','flight','status','source','parade_date','created_at'];const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const csv=[keys.join(','),...records.map(x=>keys.map(k=>q(x[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='233-sqn-roll-'+date.value+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};auth();</script></body></html>
